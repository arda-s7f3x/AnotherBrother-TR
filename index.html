<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AnotherBrother Türkçe Yama</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0d12;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Hafif Soğuk Atmosfer Katmanı */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent 50%, rgba(147, 200, 240, 0.08) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Kar Tuvali */
    canvas#snow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Ses Kontrol Butonu (Sağ Üst Köşe) */
    .audio-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.2s ease;
    }

    .audio-btn:active {
      transform: scale(0.95);
    }

    /* İçerik Kutusu */
    .container {
      position: relative;
      z-index: 2;
      padding: 20px;
      max-width: 400px;
      width: 90%;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 30px;
      line-height: 1.2;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 50px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-trailer {
      background-color: #a3e635;
      color: #000000;
    }

    .btn-download {
      background-color: #facc15;
      color: #000000;
    }

    .footer-text {
      color: #a3e635;
      font-weight: 700;
      font-size: 1rem;
      text-shadow: 0 0 8px rgba(163, 230, 53, 0.3);
    }
  </style>
</head>
<body>

  <button id="soundToggle" class="audio-btn">🔇 Ses Aç</button>

  <canvas id="snow"></canvas>

  <div class="container">
    <h1>AnotherBrother<br>Türkçe Yama</h1>

    <div class="btn-group">
      <a href="https://youtube.com" class="btn btn-trailer" target="_blank">fragman'ı izle</a>
      <a href="https://drive.google.com" class="btn btn-download" target="_blank">oyunu indir</a>
    </div>

    <div class="footer-text">
      Yama'nın yapımcısı Oyun Odası TR
    </div>
  </div>

  <script>
    // Kar Yağışı Scripti (Dümdüz aşağı)
    const canvas = document.getElementById('snow');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const numFlakes = 80;
    const flakes = [];

    for (let i = 0; i < numFlakes; i++) {
      flakes.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 3 + 1,
        speedY: Math.random() * 1.5 + 0.5
      });
    }

    function drawSnow() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
      ctx.beginPath();

      for (let i = 0; i < numFlakes; i++) {
        const f = flakes[i];
        ctx.moveTo(f.x, f.y);
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);

        f.y += f.speedY;

        if (f.y > height) {
          f.y = -10;
          f.x = Math.random() * width;
        }
      }

      ctx.fill();
      requestAnimationFrame(drawSnow);
    }

    drawSnow();

    // Dahili Rüzgar Sesi Oluşturucu (Web Audio API - Dış Bağlantı Gerektirmez)
    let audioCtx = null;
    let isPlaying = false;
    let gainNode = null;

    function createWindSound() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);

      // Pembe Gürültü (Rüzgar Uğultusu Simülasyonu)
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        let white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
        output[i] *= 0.04; // Genlik ayarı
        b6 = white * 0.115926;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      // Düşük Frekans Filtresi (Soğuk Rüzgar Uğultusu)
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 350;

      gainNode = audioCtx.createGain();
      gainNode.gain.value = 0.2; // Ses seviyesi

      whiteNoise.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      whiteNoise.start();
    }

    const soundBtn = document.getElementById('soundToggle');

    soundBtn.addEventListener('click', () => {
      if (!audioCtx) {
        createWindSound();
        isPlaying = true;
        soundBtn.textContent = "🔊 Ses Açık";
        soundBtn.style.background = "rgba(163, 230, 53, 0.3)";
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
        isPlaying = true;
        soundBtn.textContent = "🔊 Ses Açık";
        soundBtn.style.background = "rgba(163, 230, 53, 0.3)";
      } else if (isPlaying) {
        audioCtx.suspend();
        isPlaying = false;
        soundBtn.textContent = "🔇 Ses Kapalı";
        soundBtn.style.background = "rgba(255, 255, 255, 0.1)";
      } else {
        audioCtx.resume();
        isPlaying = true;
        soundBtn.textContent = "🔊 Ses Açık";
        soundBtn.style.background = "rgba(163, 230, 53, 0.3)";
      }
    });
  </script>
</body>
</html>
