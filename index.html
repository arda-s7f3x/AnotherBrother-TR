<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AnotherBrother Türkçe Yama</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0d12;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Hafif Soğuk Atmosfer Katmanı (Ekran Kenarlarında Buz Efekti) */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent 50%, rgba(147, 200, 240, 0.08) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Kar Tuvali */
    canvas#snow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* İçerik Kutusu */
    .container {
      position: relative;
      z-index: 2;
      padding: 20px;
      max-width: 400px;
      width: 90%;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 30px;
      line-height: 1.2;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 50px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-trailer {
      background-color: #a3e635;
      color: #000000;
    }

    .btn-download {
      background-color: #facc15;
      color: #000000;
    }

    .footer-text {
      color: #a3e635;
      font-weight: 700;
      font-size: 1rem;
      text-shadow: 0 0 8px rgba(163, 230, 53, 0.3);
    }
  </style>
</head>
<body>

  <canvas id="snow"></canvas>

  <div class="container">
    <h1>AnotherBrother<br>Türkçe Yama</h1>

    <div class="btn-group">
      <!-- Fragman linkini buraya yapıştırabilirsin -->
      <a href="https://youtube.com" class="btn btn-trailer" target="_blank">fragman'ı izle</a>
      
      <!-- Google Drive / İndirme linkini buraya yapıştırabilirsin -->
      <a href="https://drive.google.com" class="btn btn-download" target="_blank">oyunu indir</a>
    </div>

    <div class="footer-text">
      Yama'nın yapımcısı Oyun Odası TR
    </div>
  </div>

  <script>
    const canvas = document.getElementById('snow');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Kar Taneleri Yapısı
    const numFlakes = 80;
    const flakes = [];

    for (let i = 0; i < numFlakes; i++) {
      flakes.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 3 + 1, // Boyut
        speedY: Math.random() * 1.5 + 0.5, // Düşme hızı
        speedX: (Math.random() - 0.5) * 0.8, // Yanlara rastgele kayma
        step: Math.random() * 100, // Salınım için bağımsız açı
        stepSize: Math.random() * 0.02 + 0.01
      });
    }

    function drawSnow() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
      ctx.beginPath();

      for (let i = 0; i < numFlakes; i++) {
        const f = flakes[i];
        ctx.moveTo(f.x, f.y);
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);

        // Pozisyon Güncelleme (Her kar tanesi kendi kafasına göre süzülür)
        f.y += f.speedY;
        f.step += f.stepSize;
        f.x += Math.sin(f.step) * 0.5 + f.speedX;

        // Ekrandan çıkarsa en üstten tekrar başlat
        if (f.y > height) {
          f.y = -10;
          f.x = Math.random() * width;
        }
        if (f.x > width) f.x = 0;
        if (f.x < 0) f.x = width;
      }

      ctx.fill();
      requestAnimationFrame(drawSnow);
    }

    drawSnow();
  </script>
</body>
</html>
